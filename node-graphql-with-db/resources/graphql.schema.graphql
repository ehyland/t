type Query {
  message(id: ID!): Message!
  messages(channel: String!, fromSequenceNumber: Int): [Message!]!
}

type Mutation {
  sendMessage(message: NewMessage!): IncomingMessage!
}

type Subscription {
  messageSubscription: [IncomingMessage!]!
}

input NewMessage {
  localId: String!
  content: String!
  channel: String!
}

type Message {
  id: ID!
  sequence: Int!
  content: String!
}

type IncomingMessage {
  localId: String!
  message: Message!
}
